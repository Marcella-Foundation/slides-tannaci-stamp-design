<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Slideshow</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 100%;
    height: 100%;
    background: #000;
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, 'Inter', sans-serif;
  }

  .deck {
    position: relative;
    width: 100vw;
    height: 100vh;
  }

  .slide {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    border: none;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.5s ease;
  }

  .slide.active {
    opacity: 1;
    pointer-events: auto;
  }

  .nav {
    position: fixed;
    bottom: 18px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    align-items: center;
    gap: 14px;
    z-index: 10;
    background: rgba(0, 0, 0, 0.45);
    padding: 8px 16px;
    border-radius: 50px;
    backdrop-filter: blur(6px);
    opacity: 0;
    transition: opacity 0.3s ease;
  }

  .nav.visible { opacity: 1; }

  .nav button {
    background: rgba(255, 255, 255, 0.12);
    border: none;
    color: #fff;
    width: 34px;
    height: 34px;
    border-radius: 50%;
    cursor: pointer;
    font-size: 1rem;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.2s ease;
  }

  .nav button:hover {
    background: rgba(255, 255, 255, 0.25);
  }

  .dots {
    display: flex;
    gap: 8px;
  }

  .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.3);
    cursor: pointer;
    transition: background 0.2s ease, transform 0.2s ease;
  }

  .dot.active {
    background: #fff;
    transform: scale(1.3);
  }
</style>
</head>
<body>

<div class="deck">
  <iframe class="slide active" src="atriumIntro/index.html" title="The Atrium"></iframe>
  <iframe class="slide" src="stampPlan/index.html" title="The Plan" data-steps></iframe>
  <iframe class="slide" src="stampRules/index.html" title="Things to Know" data-steps></iframe>
  <iframe class="slide" src="handDrawn/index.html" title="Option 1: Hand-drawn" data-steps></iframe>
  <iframe class="slide" src="digitalDrawn/index.html" title="Option 2: Digitally Drawn" data-steps></iframe>
  <iframe class="slide" src="aiGenerated/index.html" title="Option 3: AI Generated" data-steps></iframe>
  <iframe class="slide" src="uploadDesign/index.html" title="Upload Your Design" data-steps></iframe>
  <!-- Hidden from deck: <iframe class="slide" src="liabilitySlips/index.html" title="Liability Slips"></iframe> -->
  <!-- Hidden from deck: <iframe class="slide" src="whatIsMarcella/index.html" title="What is Marcella Foundation?"></iframe> -->
  <!-- Hidden from deck: <iframe class="slide" src="joinDiscord/index.html" title="Join Discord"></iframe> -->
  <!-- Hidden from deck: <iframe class="slide" src="joinEyra/index.html" title="Join Eyra"></iframe> -->
  <!-- Hidden from deck: <iframe class="slide" src="installApp/index.html" title="Install Eyra"></iframe> -->
  <!-- Hidden from deck: <iframe class="slide" src="demoStructures/index.html" title="Demonstration of Structures"></iframe> -->
  <!-- Hidden from deck: <iframe class="slide" src="scribbleBots/index.html" title="Scribble Bots Recap"></iframe> -->
  <!-- Hidden from deck: <iframe class="slide" src="todaysPlan/index.html" title="Today's Plan" data-steps></iframe> -->
  <!-- Hidden from deck: <iframe class="slide" src="groundRules/index.html" title="Ground Rules" data-steps></iframe> -->
  <!-- Hidden from deck: <iframe class="slide" src="laserSteps/index.html" title="Laser Steps" data-steps></iframe> -->
  <!-- Hidden from deck: <iframe class="slide" src="laserCuttingDemo/index.html" title="Laser Cutting Demo"></iframe> -->
  <!-- Hidden from deck: <iframe class="slide" src="bitmapVsVector/index.html" title="Bitmap vs Vector"></iframe> -->
  <!-- Hidden from deck: <iframe class="slide" src="whereDoYouStand/index.html" title="Where Do You Stand?"></iframe> -->
  <!-- Hidden from deck: <iframe class="slide" src="isThisLegal/index.html" title="Is This Legal?"></iframe> -->
  <!-- Hidden from deck: <iframe class="slide" src="aiPortraitWorkflow/index.html" title="AI Portrait Workflow"></iframe> -->
</div>

<div class="nav" id="nav">
  <button id="prev" aria-label="Previous slide">&#8249;</button>
  <div class="dots" id="dots"></div>
  <button id="next" aria-label="Next slide">&#8250;</button>
</div>

<script>
  const slides = document.querySelectorAll('.slide');
  const dotsEl = document.getElementById('dots');
  const nav = document.getElementById('nav');
  let current = 0;
  let hideTimer;

  slides.forEach((_, i) => {
    const dot = document.createElement('div');
    dot.className = 'dot' + (i === 0 ? ' active' : '');
    dot.addEventListener('click', () => goTo(i));
    dotsEl.appendChild(dot);
  });
  const dots = document.querySelectorAll('.dot');

  function goTo(i) {
    if (i < 0 || i >= slides.length) return;
    const from = current;
    slides[current].classList.remove('active');
    dots[current].classList.remove('active');
    current = i;
    slides[current].classList.add('active');
    dots[current].classList.add('active');
    // Stepped slides start at their first reveal going forward, fully revealed going back.
    slides[current].contentWindow.postMessage({ deck: 'enter', at: i < from ? 'end' : 'start' }, '*');
    // Pull keyboard focus back from any iframe so arrow keys keep driving the deck.
    if (document.activeElement && document.activeElement.tagName === 'IFRAME') document.activeElement.blur();
    window.focus();
  }

  // Slides marked data-steps get Next/Prev first; they reply with 'advance' when out of reveals.
  function step(dir) {
    const slide = slides[current];
    if (slide.hasAttribute('data-steps')) slide.contentWindow.postMessage({ deck: 'step', dir }, '*');
    else goTo(current + dir);
  }

  window.addEventListener('message', (e) => {
    if (e.data && e.data.deck === 'advance' && e.source === slides[current].contentWindow) goTo(current + e.data.dir);
  });

  document.getElementById('prev').addEventListener('click', () => step(-1));
  document.getElementById('next').addEventListener('click', () => step(1));

  document.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowRight' || e.key === ' ' || e.key === 'PageDown') { e.preventDefault(); step(1); }
    if (e.key === 'ArrowLeft' || e.key === 'PageUp') { e.preventDefault(); step(-1); }
  });

  function showNav() {
    nav.classList.add('visible');
    clearTimeout(hideTimer);
    hideTimer = setTimeout(() => nav.classList.remove('visible'), 2500);
  }
  document.addEventListener('mousemove', showNav);
  showNav();
</script>

</body>
</html>
